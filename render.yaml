# Deploy no Render.
# No painel do Render: New > Blueprint > escolher este repositório.
services:
  - type: web
    name: aluga-canoas
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/fontes
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COLETA_INTERVALO_HORAS
        value: "6"
      # favoritos compartilhados (o disco do plano gratuito é apagado a cada reinício)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
