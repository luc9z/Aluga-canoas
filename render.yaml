# Deploy no Render.
# No painel do Render: New > Blueprint > escolher este repositório.
services:
  - type: web
    name: aluga-canoas
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/fontes
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COLETA_INTERVALO_HORAS
        value: "6"
      # favoritos e visitas vão para o branch "dados" do repositório
      # (o disco do plano gratuito é apagado a cada reinício)
      - key: GITHUB_TOKEN
        sync: false
      # assistente com IA; sem a chave ele usa a busca simples
      - key: ANTHROPIC_API_KEY
        sync: false
